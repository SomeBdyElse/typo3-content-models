$schema: https://json-schema.org/draft/2020-12/schema
$id: https://somebdyelse.github.io/typo3-content-models/configuration.schema.yaml
title: TYPO3 Content Models configuration
type: object
additionalProperties: true
properties:
  targetPhpNamespace:
    type: string
    minLength: 1
    description: Namespace used for generated content model classes.
  targetDirectory:
    type: string
    minLength: 1
    description: "EXT: path where generated content model classes are written."
  commonCodeGenerator:
    $ref: "#/$defs/phpClassName"
    description: PHP class name of a generator implementing SomeBdyElse\Typo3ContentModels\Generation\CommonCodeGeneratorInterface.
  overrides:
    $ref: "#/$defs/globalOverride"
required:
  - targetPhpNamespace
  - targetDirectory
$defs:
  globalOverride:
    allOf:
      - $ref: "#/$defs/overrideBase"
      - type: object
        additionalProperties: true
        properties:
          generate:
            type: boolean
          className:
            type: string
            minLength: 1
          fields:
            $ref: "#/$defs/fieldMap"
          tables:
            type: object
            additionalProperties:
              $ref: "#/$defs/tableOverride"
  tableOverride:
    allOf:
      - $ref: "#/$defs/overrideBase"
      - type: object
        additionalProperties: true
        properties:
          generate:
            type: boolean
          className:
            type: string
            minLength: 1
          fields:
            $ref: "#/$defs/fieldMap"
          types:
            type: object
            additionalProperties:
              $ref: "#/$defs/override"
  override:
    allOf:
      - $ref: "#/$defs/overrideBase"
      - type: object
        additionalProperties: true
        properties:
          generate:
            type: boolean
          className:
            type: string
            minLength: 1
          fields:
            $ref: "#/$defs/fieldMap"
  overrideBase:
    type: object
    properties:
      generate:
        type: boolean
      className:
        type: string
        minLength: 1
      generator:
        $ref: "#/$defs/phpClassName"
      fields:
        $ref: "#/$defs/fieldMap"
  phpClassName:
    type: string
    minLength: 1
    pattern: '^[A-Za-z_][A-Za-z0-9_]*(\\[A-Za-z_][A-Za-z0-9_]*)*$'
    description: PHP class name, for example the result of Some\Generator::class.
  fieldMap:
    type: object
    additionalProperties:
      $ref: "#/$defs/fieldOverride"
  fieldOverride:
    type: object
    additionalProperties: true
    properties:
      relationTargetTypes:
        type: object
        additionalProperties:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
