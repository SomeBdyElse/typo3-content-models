name: Checks

on:
  push:
  pull_request:

jobs:
  install:
    name: Install dependencies with TYPO3 ${{ matrix.typo3-version }}
    runs-on: ubuntu-latest
    strategy: &typo3-version-strategy
      fail-fast: false
      matrix:
        typo3-version:
          - '13.4'
          - '14.3'
    env:
      TYPO3_PATH_APP: ${{ github.workspace }}/.Build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Select TYPO3 version
        run: >
          composer require --dev --no-update
          typo3/cms-backend:"^${{ matrix.typo3-version }}"
          typo3/cms-core:"^${{ matrix.typo3-version }}"
          typo3/cms-extbase:"^${{ matrix.typo3-version }}"
          typo3/cms-felogin:"^${{ matrix.typo3-version }}"
          typo3/cms-fluid:"^${{ matrix.typo3-version }}"
          typo3/cms-fluid-styled-content:"^${{ matrix.typo3-version }}"
          typo3/cms-form:"^${{ matrix.typo3-version }}"
          typo3/cms-frontend:"^${{ matrix.typo3-version }}"
          typo3/cms-indexed-search:"^${{ matrix.typo3-version }}"
          typo3/cms-install:"^${{ matrix.typo3-version }}"
          typo3/cms-seo:"^${{ matrix.typo3-version }}"
          typo3/cms-styleguide:"^${{ matrix.typo3-version }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress -W

      - name: Upload dependencies
        uses: actions/upload-artifact@v7
        with:
          name: composer-dependencies-typo3-${{ matrix.typo3-version }}
          path: .Build
          include-hidden-files: true
          if-no-files-found: error

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    needs: install
    env:
      TYPO3_PATH_APP: ${{ github.workspace }}/.Build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Download dependencies
        uses: actions/download-artifact@v7
        with:
          name: composer-dependencies-typo3-14.3
          path: .Build

      - name: Run PHP-CS-Fixer
        run: php .Build/bin/php-cs-fixer fix --config=Build/php-cs-fixer/.php-cs-fixer.dist.php --dry-run --diff --using-cache=no --sequential

  phpstan:
    name: PHPStan with TYPO3 ${{ matrix.typo3-version }}
    runs-on: ubuntu-latest
    needs: install
    strategy: *typo3-version-strategy
    env:
      TYPO3_PATH_APP: ${{ github.workspace }}/.Build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Download dependencies
        uses: actions/download-artifact@v7
        with:
          name: composer-dependencies-typo3-${{ matrix.typo3-version }}
          path: .Build

      - name: Run PHPStan
        run: php .Build/bin/phpstan analyse --configuration=Build/phpstan/phpstan.neon --memory-limit=1G --no-progress

  functional-tests:
    name: Functional tests with TYPO3 ${{ matrix.typo3-version }}
    runs-on: ubuntu-latest
    needs: install
    strategy: *typo3-version-strategy
    env:
      TYPO3_PATH_APP: ${{ github.workspace }}/.Build
      TYPO3_PATH_ROOT: ${{ github.workspace }}/.Build/Web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Download dependencies
        uses: actions/download-artifact@v7
        with:
          name: composer-dependencies-typo3-${{ matrix.typo3-version }}
          path: .Build

      - name: Run functional tests
        run: composer test:functional
